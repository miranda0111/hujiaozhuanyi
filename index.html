<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=yes">
    <title>呼叫转移设置</title>
    <style>
        body{padding:20px;font-size:18px;}
        .btn{display:block;margin:12px 0;padding:14px;background:#0071e3;color:#fff;text-decoration:none;border-radius:8px;text-align:center;}
    </style>
</head>
<body>
    <h3>安卓浏览器点击唤起拨号（需要手动点拨打）</h3>
    <!-- 修改里面13800138000为你要转移的手机号 -->
    <a class="btn" href="tel:%2a21%2a13800138000%23">开启无条件呼叫转移至13800138000</a>
    <a class="btn" href="tel:%23%2321%23">取消无条件呼叫转移</a>
    <a class="btn" href="tel:%23%23002%23">取消全部呼叫转移</a>

    <p>⚠️苹果iOS不支持，只能手动在拨号键盘输入指令；微信内置浏览器可能失效，请用系统浏览器打开。</p>
</body>
</html>
